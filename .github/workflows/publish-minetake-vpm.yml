name: Publish Minetake VPM

# Single maintainer entry point: pick package, branch, and version bump type.
# Bumps package.json, syncs to basis-vpm, and triggers VPM publish automatically.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - net.minetake.basis.transparent-mirror
      source_branch:
        description: >-
          Source branch. "(workflow branch)" uses the branch selected in the
          Run workflow dropdown above. Pick a named branch to override.
        required: true
        type: choice
        default: '(workflow branch)'
        options:
          - '(workflow branch)'
          - feat/transparent-mirror
          - developer
      bump_type:
        description: Version bump applied to package.json before publish
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - prerelease
      prerelease_identifier:
        description: >-
          Prerelease identifier when bump_type=prerelease (e.g. rc, beta).
          Leave empty for dev.<year>.W<week>.<run>.
        required: false
        type: string

permissions:
  contents: write

env:
  HUB_REPO: minetake01/basis-vpm
  PACKAGE_ROOT: Basis/Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source branch
        id: branch
        run: |
          set -euo pipefail
          SELECTED="${{ inputs.source_branch }}"
          if [ "$SELECTED" = "(workflow branch)" ]; then
            REF="${{ github.ref_name }}"
          else
            REF="$SELECTED"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using source branch: $REF"

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.ref }}

      - name: Validate package is listed
        run: |
          set -euo pipefail
          PKG="${{ inputs.package }}"
          if ! grep -qxF "$PKG" .github/minetake-vpm-packages.txt; then
            echo "::error::${PKG} is not listed in .github/minetake-vpm-packages.txt"
            exit 1
          fi

      - name: Bump package version
        id: meta
        env:
          PKG: ${{ inputs.package }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          IDENTIFIER: ${{ inputs.prerelease_identifier }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          PKG_JSON="${PACKAGE_ROOT}/${PKG}/package.json"
          python3 .github/scripts/publish_helpers.py bump-package \
            "$PKG_JSON" \
            --bump-type "$BUMP_TYPE" \
            --identifier "$IDENTIFIER" \
            --run-number "$RUN_NUMBER" \
            --write

      - name: Commit version bump to source branch
        env:
          PKG: ${{ inputs.package }}
          PUBLISH_VERSION: ${{ steps.meta.outputs.publish_version }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PACKAGE_ROOT}/${PKG}/package.json"
          git commit -m "chore(vpm): ${PKG}@${PUBLISH_VERSION} (${BUMP_TYPE})"
          git push

      - name: Checkout basis-vpm hub
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HUB_REPO }}
          token: ${{ secrets.BASIS_VPM_SYNC_TOKEN }}
          path: basis-vpm

      - name: Sync package to hub
        env:
          PKG: ${{ inputs.package }}
        run: |
          set -euo pipefail
          SRC="${PACKAGE_ROOT}/${PKG}"
          DEST="basis-vpm/Packages/${PKG}"
          if [ ! -d "$SRC" ]; then
            echo "::error::Package not found at ${SRC}"
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -a "$SRC" "$DEST"

          MANIFEST="basis-vpm/.github/vpm-packages.txt"
          if ! grep -qxF "$PKG" "$MANIFEST"; then
            echo "$PKG" >> "$MANIFEST"
            echo "Registered ${PKG} in hub vpm-packages.txt"
          fi

      - name: Commit and push to hub
        id: push
        env:
          PKG: ${{ inputs.package }}
          BRANCH: ${{ steps.branch.outputs.ref }}
          PUBLISH_VERSION: ${{ steps.meta.outputs.publish_version }}
        working-directory: basis-vpm
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Packages/${PKG}" .github/vpm-packages.txt
          if git diff --staged --quiet; then
            echo "No file changes on hub (package content unchanged)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: ${PKG}@${PUBLISH_VERSION} from ${BRANCH}"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger VPM publish on hub
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BASIS_VPM_SYNC_TOKEN }}
          repository: ${{ env.HUB_REPO }}
          event-type: vpm-publish
          client-payload: >-
            {
              "package": "${{ inputs.package }}",
              "base_version": "${{ steps.meta.outputs.previous_version }}",
              "publish_version": "${{ steps.meta.outputs.publish_version }}",
              "display_name": "${{ steps.meta.outputs.display_name }}",
              "tag": "${{ steps.meta.outputs.tag }}",
              "release_name": "${{ steps.meta.outputs.release_name }}",
              "prerelease": ${{ steps.meta.outputs.prerelease == 'true' }},
              "source_branch": "${{ steps.branch.outputs.ref }}",
              "source_sha": "${{ github.sha }}"
            }
