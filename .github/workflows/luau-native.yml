name: Luau native plugins

on:
  workflow_dispatch:
  push:
    paths:
      - 'Basis/Packages/net.minetake.luau/Native~/**'
      - 'Basis/Packages/net.minetake.luau/Native/**'
      - '.github/workflows/luau-native.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM, CMake, and Ninja
        run: choco install llvm cmake ninja -y
      - name: Build libluau and limits (Windows x64)
        shell: pwsh
        run: ./Basis/Packages/net.minetake.luau/Native~/build-libluau.ps1
      - name: Build Windows x64 natives
        shell: pwsh
        run: ./Basis/Packages/net.minetake.luau/Native~/build-runtime.ps1
      - name: Smoke test limits
        shell: pwsh
        run: ./Basis/Packages/net.minetake.luau/Native~/test-limits.ps1
      - name: Smoke test runtime
        shell: pwsh
        run: ./Basis/Packages/net.minetake.luau/Native~/test-runtime.ps1

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential ninja-build libc++-dev libc++abi-dev
      - name: Build linux-x64 natives
        run: ./Basis/Packages/net.minetake.luau/Native~/build-libluau.sh linux-x64

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: dtolnay/rust-toolchain@1.86
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install Rust aarch64 target (luau-ffi pins 1.86)
        run: rustup target add aarch64-unknown-linux-gnu --toolchain 1.86-x86_64-unknown-linux-gnu
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential ninja-build libc++-dev libc++abi-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build linux-arm64 natives
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          AR: aarch64-linux-gnu-ar
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: ./Basis/Packages/net.minetake.luau/Native~/build-libluau.sh linux-arm64

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS natives
        run: ./Basis/Packages/net.minetake.luau/Native~/build-libluau.sh osx
